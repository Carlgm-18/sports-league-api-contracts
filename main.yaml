openapi: 3.0.3
info:
  title: Sports Leagues management API
  version: 1.1.0
  description: >
    API RESTful para el sistema de gestión deportiva.
    Incluye flujos de inscripción, gestión de roles (Administrador, Árbitro, Capitán, Jugador),
    máquina de estados para agendamiento de partidos y actas digitales con firmas.
servers:
  - url: http://localhost:8079/api/v1
    description: Development local server

tags:
  - name: Usuarios
  - name: Ligas
  - name: Fases
  - name: Partidos
  - name: Equipos
  - name: Participaciones
  - name: Incidencias
  - name: Deportes

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PhaseBaseDetails:
      $ref: './schemas/phase.yaml#/PhaseBaseDetails'
    ClassificationPhaseDetails:
      $ref: './schemas/phase.yaml#/ClassificationPhaseDetails'
    TournamentPhaseDetails:
      $ref: './schemas/phase.yaml#/TournamentPhaseDetails'
    PhaseDetails:
      $ref: './schemas/phase.yaml#/PhaseDetails'
    PhaseCreateRequest:
      $ref: './schemas/phase.yaml#/PhaseCreateRequest'
    ClassificationPhaseCreateRequest:
      $ref: './schemas/phase.yaml#/ClassificationPhaseCreateRequest'
    TournamentPhaseCreateRequest:
      $ref: './schemas/phase.yaml#/TournamentPhaseCreateRequest'
    PhaseBaseUpdateRequest:
      $ref: './schemas/phase.yaml#/PhaseBaseUpdateRequest'
    ClassificationPhaseUpdateRequest:
      $ref: './schemas/phase.yaml#/ClassificationPhaseUpdateRequest'
    TournamentPhaseUpdateRequest:
      $ref: './schemas/phase.yaml#/TournamentPhaseUpdateRequest'
    PhaseUpdateRequest:
      $ref: './schemas/phase.yaml#/PhaseUpdateRequest'
    ClassificationGroupDetails:
      $ref: './schemas/phase.yaml#/ClassificationGroupDetails'
    ClassificationGroupCreateRequest:
      $ref: './schemas/phase.yaml#/ClassificationGroupCreateRequest'
    ClassificationGroupUpdateRequest:
      $ref: './schemas/phase.yaml#/ClassificationGroupUpdateRequest'
    TournamentSlotDetails:
      $ref: './schemas/phase.yaml#/TournamentSlotDetails'
    TournamentSlotUpdateRequest:
      $ref: './schemas/phase.yaml#/TournamentSlotUpdateRequest'

    SportDetails:
      $ref: './schemas/sport.yaml#/SportDetails'


    FormErrorResponse:
      $ref: './schemas/errors.yaml#/FormErrorResponse'
    ValidationError:
      $ref: './schemas/errors.yaml#/ValidationError'

    UserCategory:
      $ref: './schemas/user.yaml#/UserCategory'
    SignImageUrl:
      $ref: './schemas/user.yaml#/SignImageUrl'
    LicenseElement:
      $ref: './schemas/user.yaml#/LicenseElement'
    LicensesList:
      $ref: './schemas/user.yaml#/LicensesList'
    UserCreateRequest:
      $ref: './schemas/user.yaml#/UserCreateRequest'
    UserCreateResponse:
      $ref: './schemas/user.yaml#/UserCreateResponse'
    UserUpdateRequest:
      $ref: './schemas/user.yaml#/UserUpdateRequest'
    UserLoginRequest:
      $ref: './schemas/user.yaml#/UserLoginRequest'
    UserDetails:
      $ref: './schemas/user.yaml#/UserDetails'
    UserSummary:
      $ref: './schemas/user.yaml#/UserSummary'
    UserAuthResponse:
      $ref: './schemas/user.yaml#/UserAuthResponse'

    LeagueState:
      $ref: './schemas/league.yaml#/LeagueState'
    LeagueCategory:
      $ref: './schemas/league.yaml#/LeagueCategory'
    LeagueCreateRequest:
      $ref: './schemas/league.yaml#/LeagueCreateRequest'
    LeagueUpdateRequest:
      $ref: './schemas/league.yaml#/LeagueUpdateRequest'
    ConfigurationCreateRequest:
      $ref: './schemas/league.yaml#/ConfigurationCreateRequest'
    ConfigurationUpdateRequest:
      $ref: './schemas/league.yaml#/ConfigurationUpdateRequest'
    ConfigurationDetails:
      $ref: './schemas/league.yaml#/ConfigurationDetails'
    PunctuationSystemCreateRequest:
      $ref: './schemas/league.yaml#/PunctuationSystemCreateRequest'
    PunctuationSystemDetails:
      $ref: './schemas/league.yaml#/PunctuationSystemDetails'
    PunctuationSystemRuleDetails:
      $ref: './schemas/league.yaml#/PunctuationSystemRuleDetails'
    LeagueDetails:
      $ref: './schemas/league.yaml#/LeagueDetails'
    LeagueSummary:
      $ref: './schemas/league.yaml#/LeagueSummary'

    ParticipantDetails:
      $ref: './schemas/participant.yaml#/ParticipantDetails'
    ParticipantSummary:
      $ref: './schemas/participant.yaml#/ParticipantSummary'
    ParticipationRoleDTO:
      $ref: './schemas/participant.yaml#/ParticipationRoleDTO'
    ParticipantUpdateDetails:
      $ref: './schemas/participant.yaml#/ParticipantUpdateRequest'

    TeamDetails:
      $ref: './schemas/team.yaml#/TeamDetails'
    TeamSummary:
      $ref: './schemas/team.yaml#/TeamSummary'
    TeamMembersDetails:
      $ref: './schemas/team.yaml#/TeamMembersDetails'

    RequestState:
      $ref: './schemas/league_requests.yaml#/RequestState'
    BaseRequest:
      $ref: './schemas/league_requests.yaml#/BaseRequest'
    TeamJoinRequestProperties:
      $ref: './schemas/league_requests.yaml#/TeamJoinRequestProperties'
    TeamJoinRequest:
      $ref: './schemas/league_requests.yaml#/TeamJoinRequest'
    TeamCreateRequestProperties:
      $ref: './schemas/league_requests.yaml#/TeamCreateRequestProperties'
    TeamCreateRequest:
      $ref: './schemas/league_requests.yaml#/TeamCreateRequest'
    RefereeRequest:
      $ref: './schemas/league_requests.yaml#/RefereeRequest'
    ResolveRequestInput:
      $ref: './schemas/league_requests.yaml#/ResolveRequestInput'

    DateTimeSlotDetails:
      $ref: './schemas/match.yaml#/DateTimeSlotDetails'
    ProposalState:
      $ref: './schemas/match.yaml#/ProposalState'
    MatchState:
      $ref: './schemas/match.yaml#/MatchState'
    MatchDateProposalRequest:
      $ref: './schemas/match.yaml#/MatchDateProposalRequest'
    MatchDateProposalDetails:
      $ref: './schemas/match.yaml#/MatchDateProposalDetails'
    MatchDetails:
      $ref: './schemas/match.yaml#/MatchDetails'
    MatchSummary:
      $ref: './schemas/match.yaml#/MatchSummary'
    ResultSummary:
      $ref: './schemas/match.yaml#/ResultSummary'
    ResultDetails:
      $ref: './schemas/match.yaml#/ResultDetails'
    MatchSignatures:
      $ref: './schemas/match.yaml#/MatchSignatures'
    MatchPeriod:
      $ref: './schemas/match.yaml#/MatchPeriod'
    MatchEvent:
      $ref: './schemas/match.yaml#/MatchEvent'
    SubstitutionEvent:
      $ref: './schemas/match.yaml#/SubstitutionEvent'
    SanctionEvent:
      $ref: './schemas/match.yaml#/SanctionEvent'
    TimeoutEvent:
      $ref: './schemas/match.yaml#/TimeoutEvent'

    IncidenceCreateRequest:
      $ref: './schemas/incidence.yaml#/IncidenceCreateRequest'
    IncidenceUpdateRequest:
      $ref: './schemas/incidence.yaml#/IncidenceUpdateRequest'
    IncidenceResolutionRequest:
    IncidenceDetails:
      $ref: './schemas/incidence.yaml#/IncidenceDetails'

    UserLeagueStatus:
      $ref: './schemas/league.yaml#/UserLeagueStatus'
    LeaderboardRow:
      $ref: './schemas/league.yaml#/LeaderboardRow'
    LeaderboardGroup:
      $ref: './schemas/league.yaml#/LeaderboardGroup'
    LeaderboardResponse:
      $ref: './schemas/league.yaml#/LeaderboardResponse'

    RoundDetails:
      $ref: './schemas/round.yaml#/RoundDetails'

  responses:
    BadRequest:
      description: "Los datos enviados son incorrectos o el formulario es inválido."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FormErrorResponse"
    Unauthorized:
      description: "Es necesario iniciar sesión"

security:
  - bearerAuth: []

paths:
  /sports:
    $ref: './paths/sport.yaml#/sports'

  /users/register:
    $ref: './paths/user.yaml#/register'
  /users/login:
    $ref: './paths/user.yaml#/login'
  /auth/external-authentication:
    $ref: './paths/user.yaml#/externalAuthentication'
  /users/me/signature:
    $ref: './paths/user.yaml#/signature'
  /users/me:
    $ref: './paths/user.yaml#/me'
  /users/me/invitations:
    $ref: './paths/user.yaml#/invitations'
  /users/me/invitations/{requestId}:
    $ref: './paths/user.yaml#/invitationById'
  /users/me/leagues:
    $ref: './paths/user.yaml#/leagues'

  /leagues:
    $ref: './paths/league.yaml#/leagues'
  /leagues/{leagueId}:
    $ref: './paths/league.yaml#/leagueById'
  /leagues/{leagueId}/phases:
    $ref: './paths/league.yaml#/phases'
  /leagues/{leagueId}/phases/{phaseId}:
    $ref: './paths/league.yaml#/phaseById'
  /leagues/{leagueId}/incidences:
    $ref: './paths/league.yaml#/incidences'
  /leagues/{leagueId}/incidences/{incidenceId}:
    $ref: './paths/league.yaml#/incidenceById'
  /leagues/{leagueId}/leaderboard:
    $ref: './paths/league.yaml#/leaderboard'
  /leagues/{leagueId}/configuration:
    $ref: './paths/league.yaml#/configuration'
  /leagues/{leagueId}/punctuation-system:
    $ref: './paths/league.yaml#/punctuationSystem'
  /leagues/{leagueId}/my-status:
    $ref: './paths/league.yaml#/myStatus'
  /leagues/{leagueId}/referee-requests:
    $ref: './paths/league.yaml#/refereeRequests'
  /leagues/{leagueId}/referee-requests/{requestId}:
    $ref: './paths/league.yaml#/refereeRequestById'

  /leagues/{leagueId}/participants:
    $ref: './paths/participant.yaml#/participants'
  /leagues/{leagueId}/participants/{participantId}:
    $ref: './paths/participant.yaml#/participantById'
  /leagues/{leagueId}/phases/{phaseId}/rounds/{roundId}/participants/{participantId}/availability:
    $ref: './paths/participant.yaml#/participantAvailability'

  /leagues/{leagueId}/teams:
    $ref: './paths/team.yaml#/teams'
  /leagues/{leagueId}/teams/requests/{requestId}:
    $ref: './paths/team.yaml#/teamRequests'
  /leagues/{leagueId}/teams/{teamId}:
    $ref: './paths/team.yaml#/teamById'
  /teams/{teamId}/join-requests:
    $ref: './paths/team.yaml#/joinRequests'
  /teams/{teamId}/join-requests/{requestId}:
    $ref: './paths/team.yaml#/joinRequestById'
  /teams/{teamId}/invitations:
    $ref: './paths/team.yaml#/invitations'
  /teams/{teamId}/members/{participantId}:
    $ref: './paths/team.yaml#/memberById'

  /leagues/{leagueId}/matches:
    $ref: './paths/match.yaml#/matches'
  /matches/{matchId}:
    $ref: './paths/match.yaml#/matchById'
  /matches/{matchId}/schedule/proposals:
    $ref: './paths/match.yaml#/scheduleProposals'
  /matches/{matchId}/schedule/accept:
    $ref: './paths/match.yaml#/scheduleAccept'
  /matches/{matchId}/schedule/force:
    $ref: './paths/match.yaml#/scheduleForce'
  /matches/{matchId}/result:
    $ref: './paths/match.yaml#/result'
  /matches/{matchId}/signatures:
    $ref: './paths/match.yaml#/signatures'
  /matches/{matchId}/start:
    $ref: './paths/match.yaml#/start'
  /matches/{matchId}/finish:
    $ref: './paths/match.yaml#/finish'
  /leagues/{leagueId}/phases/{phaseId}/rounds/{roundId}/availability:
    $ref: './paths/match.yaml#/availability'
