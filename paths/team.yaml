teams:
  get:
    tags:
      - Equipos
    summary: Listar equipos de la liga
    parameters:
      - in: path
        name: leagueId
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: "Lista de equipos"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/team.yaml#/TeamDetails"

teamById:
  get:
    tags:
      - Equipos
    summary: Obtener detalle del equipo
    parameters:
      - in: path
        name: teamId
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: "Detalle del equipo"
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../schemas/team.yaml#/TeamDetails"
                - $ref: "../schemas/team.yaml#/TeamMembersDetails"
      "404":
        description: "Equipo no encontrado."
  delete:
    tags:
      - Equipos
    summary: Eliminar equipo
    parameters:
      - in: path
        name: teamId
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "204":
        description: "Equipo eliminado"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
      "403":
        description: "Prohibido: Solo Capitán o Admin."
      "404":
        description: "Equipo no encontrado."

joinRequests:
  get:
    tags:
      - Equipos
    summary: Listar solicitudes de unión al equipo
    parameters:
      - in: path
        name: teamId
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: "Lista de solicitudes de unión pendientes"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/league_requests.yaml#/TeamJoinRequest"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
      "403":
        description: "Prohibido: Solo Capitán."
      "404":
        description: "Equipo no encontrado."

invitations:
  post:
    tags:
      - Equipos
    summary: Capitán invita a un jugador sin equipo
    parameters:
      - in: path
        name: teamId
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [participantId]
            properties:
              participantId:
                type: integer
                format: int64
    responses:
      "201":
        description: "Invitación enviada al jugador"
        content:
          application/json:
            schema:
              $ref: "../schemas/league_requests.yaml#/BaseRequest"
      "400":
        $ref: "../main.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
      "403":
        description: "Prohibido: Solo Capitán."
      "404":
        description: "Equipo o participante no encontrado."
      "409":
        description: "El jugador ya tiene equipo."

memberById:
  delete:
    tags:
      - Equipos
    summary: Capitán expulsa a un jugador del equipo
    parameters:
      - in: path
        name: teamId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: participantId
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "204":
        description: "Jugador expulsado"
      "400":
        description: "El participante no está en este equipo."
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
      "403":
        description: "Prohibido: Solo Capitán."
      "404":
        description: "Participante o equipo no encontrado."
