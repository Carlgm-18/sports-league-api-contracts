participants:
  get:
    tags:
      - Participaciones
    summary: Listar participantes de la liga
    parameters:
      - in: path
        name: leagueId
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: "Lista de participantes resumida"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/participant.yaml#/ParticipantSummary"
      "404":
        description: "Liga no encontrada."
  post:
    tags:
      - Participaciones
    summary: Unirse a una liga
    parameters:
      - in: path
        name: leagueId
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "201":
        description: "Inscripción exitosa"
        content:
          application/json:
            schema:
              $ref: "../schemas/participant.yaml#/ParticipantDetails"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
      "404":
        description: "Liga no encontrada."
      "409":
        description: "El usuario ya participa en esta liga."
      "422":
        description: "Inscripciones cerradas o desajuste de categoría."

participantById:
  patch:
    tags:
      - Participaciones
    summary: Actualizar datos del participante (dorsal)
    parameters:
      - in: path
        name: participantId
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/participant.yaml#/ParticipantUpdateRequest"
    responses:
      "200":
        description: "Participante actualizado correctamente"
        content:
          application/json:
            schema:
              $ref: "../schemas/participant.yaml#/ParticipantDetails"
      "400":
        description: "El participante no pertenece a un equipo."
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
      "403":
        description: "Prohibido: Solo el propio participante."
      "404":
        description: "Participante o liga no encontrado."
      "409":
        description: "El dorsal ya está ocupado."

participantAvailability:
  get:
    tags:
      - Participaciones
    summary: Obtener la disponibilidad horaria del participante en la liga
    parameters:
      - in: path
        name: leagueId
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: "Lista de franjas elegidas por el participante."
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/match.yaml#/DateTimeSlotDetails"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
      "404":
        description: "Participante o liga no encontrados."

  put:
    tags:
      - Participaciones
    summary: Establecer o actualizar la disponibilidad del participante en la liga
    parameters:
      - in: path
        name: leagueId
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: integer
              format: int64
              description: 'dateTimeSlotIds'
    responses:
      "204":
        description: "Disponibilidad del participante guardada correctamente."
      "400":
        description: "Alguna de las franjas elegidas no es válida."
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
      "404":
        description: "Participante o liga no encontrados."
