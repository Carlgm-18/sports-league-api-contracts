register:
  post:
    tags:
      - Usuarios
    summary: Crear una nueva cuenta de usuario
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yaml#/UserCreateRequest"
    responses:
      "201":
        description: "Usuario creado con éxito"
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/UserCreateResponse"
      "400":
        $ref: "../main.yaml#/components/responses/BadRequest"
      "409":
        description: "El email ya está registrado."

login:
  post:
    tags:
      - Usuarios
    summary: Iniciar sesión
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yaml#/UserLoginRequest"
    responses:
      "200":
        description: "Devuelve el JWT Token"
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/UserAuthResponse"
      "401":
        description: "Credenciales inválidas"
        content:
          application/json:
            schema:
              $ref: "../schemas/errors.yaml#/FormErrorResponse"

refreshToken:
  post:
    tags:
      - Usuarios
    summary: Refrescar token de acceso
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yaml#/RefreshTokenRequest"
    responses:
      "200":
        description: "Devuelve el nuevo JWT Token"
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/UserAuthResponse"
      "401":
        description: "Refresh token inválido"

externalAuthentication:
  post:
    tags:
      - Usuarios
    summary: Verifica la autenticación de un usuario desde un servicio externo
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              serviceName:
                type: string
    responses:
      "200":
        description: "Usuario creado con éxito"
      "400":
        $ref: "../main.yaml#/components/responses/BadRequest"
      "502":
        description: "El servicio ha sufrido un error"
      "503":
        description: "Servicio no disponible"

signature:
  get:
    summary: Obtener la firma del usuario actual
    tags:
      - Usuarios
    responses:
      "200":
        description: "Firma encontrada"
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/SignImageUrl"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
      "404":
        description: "Firma no encontrada"
  post:
    summary: Guardar la firma del usuario
    description: "Sube la URL de la imagen de la firma del usuario."
    tags:
      - Usuarios
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yaml#/SignImageUrl"
    responses:
      "200":
        description: "Firma guardada"
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/SignImageUrl"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"

me:
  get:
    summary: Obtener la información pública del usuario actual
    tags:
      - Usuarios
    responses:
      "200":
        description: "Detalles del usuario"
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/UserDetails"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
  patch:
    summary: Permitir al usuario editar los detalles de su cuenta
    tags:
      - Usuarios
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yaml#/UserUpdateRequest"
    responses:
      "201":
        description: "Cambios guardados de forma exitosa"
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/UserDetails"
      "400":
        $ref: "../main.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"

invitations:
  get:
    summary: Obtener todas las invitaciones pendientes del usuario
    description: "Devuelve las solicitudes de unión a equipos."
    tags:
      - Usuarios
    responses:
      "200":
        description: "Lista global de invitaciones"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/league_requests.yaml#/TeamJoinRequest"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"

leagues:
  get:
    tags:
      - Usuarios
    summary: Listar ligas en las que el usuario participa
    responses:
      "200":
        description: "Lista de ligas del usuario"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/league.yaml#/LeagueSummary"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
