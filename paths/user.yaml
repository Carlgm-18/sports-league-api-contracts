register:
  post:
    tags:
      - Usuarios
    summary: Crear una nueva cuenta de usuario
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yaml#/UserCreateRequest"
    responses:
      "201":
        description: "Usuario creado con éxito"
      "400":
        $ref: "../main.yaml#/components/responses/BadRequest"
      "409":
        description: "El email ya está registrado."

login:
  post:
    tags:
      - Usuarios
    summary: Iniciar sesión
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yaml#/UserLoginRequest"
    responses:
      "200":
        description: "Devuelve el JWT Token"
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/UserAuthResponse"
      "401":
        description: "Credenciales inválidas"
        content:
          application/json:
            schema:
              $ref: "../schemas/errors.yaml#/FormErrorResponse"

externalAuthentication:
  post:
    tags:
      - Usuarios
    summary: Verifica la autenticación de un usuario desde un servicio externo
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              serviceName:
                type: string
    responses:
      "200":
        description: "Usuario creado con éxito"
      "400":
        $ref: "../main.yaml#/components/responses/BadRequest"
      "502":
        description: "El servicio ha sufrido un error"
      "503":
        description: "Servicio no disponible"

signature:
  put:
    summary: Actualizar la firma del usuario
    description: "Pide una URL prefirmada al backend para persistir la imagen de la firma y sube la URL para acceder desde el sistema S3."
    tags:
      - Usuarios
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yaml#/SignImageUrl"
    responses:
      "200":
        description: "Firma guardada"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"

me:
  get:
    summary: Obtener la información pública del usuario actual
    tags:
      - Usuarios
    responses:
      "200":
        description: "Detalles del usuario"
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/UserDetails"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
  patch:
    summary: Permitir al usuario editar los detalles de su cuenta
    tags:
      - Usuarios
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yaml#/UserUpdateRequest"
    responses:
      "200":
        description: "Cambios guardados de forma exitosa"
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/UserDetails"
      "400":
        $ref: "../main.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"

invitations:
  get:
    summary: Obtener todas las invitaciones pendientes del usuario
    description: "Devuelve las solicitudes de unión a equipos."
    tags:
      - Usuarios
    responses:
      "200":
        description: "Lista global de invitaciones"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/league_requests.yaml#/TeamJoinRequest"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"

invitationById:
  patch:
    summary: Jugador acepta/rechaza unirse a un equipo
    tags:
      - Usuarios
    parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: integer
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                $ref: "../schemas/league_requests.yaml#/RequestState"
    responses:
      "200":
        description: "Invitación resuelta"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"

leagues:
  get:
    tags:
      - Usuarios
    summary: Listar ligas en las que el usuario participa
    responses:
      "200":
        description: "Lista de ligas del usuario"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/league.yaml#/LeagueDetails"
      "401":
        $ref: "../main.yaml#/components/responses/Unauthorized"
