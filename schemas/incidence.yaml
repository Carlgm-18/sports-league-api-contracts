IncidenceCreateRequest:
  type: object
  required: [description]
  properties:
    description:
      type: string

IncidenceResolutionRequest:
  type: object
  required: [resolution]
  properties:
    resolution:
      type: string

IncidenceDetails:
  type: object
  required: [description, resolution]
  properties:
    incidenceId:
      type: integer
      format: int64
    description:
      type: string
    resolution:
      type: string
