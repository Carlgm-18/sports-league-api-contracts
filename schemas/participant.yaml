ParticipationRoleDTO:
  type: string
  enum: ["ADMIN", "REFEREE", "PLAYER", "CAPTAIN"]

ParticipantDetails:
  type: object
  required: [participantId, userId, leagueId, roles, joinDate]
  properties:
    participantId:
      type: integer
      format: int64
    userId:
      type: integer
      format: int64
    leagueId:
      type: integer
      format: int64
    team:
      $ref: "./team.yaml#/TeamSummary"
    dorsal:
      type: integer
      description: "Número del dorsal del jugador cuando está en un equipo"
    roles:
      type: array
      items:
        $ref: "#/ParticipationRoleDTO"
    joinDate:
      type: string
      format: date-time

ParticipantUpdateRequest:
  type: object
  required: [dorsal]
  properties:
    dorsal:
      type: integer
      description: "Player dorsal when participant is in a team"

ParticipantSummary:
  type: object
  required: [participantId, fullName, roles, joinDate]
  properties:
    participantId:
      type: integer
      format: int64
    fullName:
      type: string
    team:
      $ref: "./team.yaml#/TeamSummary"
    roles:
      type: array
      items:
        $ref: "#/ParticipationRoleDTO"
    dorsal:
      type: integer
      description: "Número del dorsal del jugador cuando está en un equipo"
